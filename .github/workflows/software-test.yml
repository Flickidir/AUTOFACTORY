name: Software tests
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
            - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
- name: Test adapter and audiovisual integration
        run: |
          python -m py_compile providers/groq_voice.py app.py voice_render.py
          python - <<'PY'
          import os, tempfile, wave
          from pathlib import Path
          from unittest.mock import patch
          from providers.groq_voice import split_text, synthesize
          import voice_render
          text = ('Aviation makes curious people ask questions. ' * 15).strip()
          chunks = split_text(text)
          assert ' '.join(chunks) == text
          assert all(0 < len(part) <= 200 for part in chunks)
          os.environ.pop('GROQ_API_KEY', None)
          try:
              synthesize('Hello', '/tmp/autofactory-unused')
          except RuntimeError:
              pass
          else:
              raise AssertionError('missing key was accepted')
          with tempfile.TemporaryDirectory() as directory:
              try:
                  voice_render.run('A ' * 150, directory)
              except ValueError:
                  pass
              else:
                  raise AssertionError('oversized test accepted')
              audio = str(Path(directory) / 'synthetic.wav')
              with wave.open(audio, 'wb') as f:
                  f.setnchannels(1)
                  f.setsampwidth(2)
                  f.setframerate(16000)
                  f.writeframes(b'\x00\x00' * 16000)
              with patch('voice_render.synthesize', return_value=[audio]):
                  result = voice_render.run('Test', directory)
              streams = result['probe']['streams']
              assert any(x.get('codec_name') == 'h264' and x.get('width') == 720 and x.get('height') == 1280 for x in streams)
              assert any(x.get('codec_name') == 'aac' for x in streams)
              assert 0.9 <= float(result['probe']['format']['duration']) <= 1.2
              print('Synthetic WAV to MP4 integration passed; no real TTS used')
          PY
